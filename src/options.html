<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger UI Theme Settings</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --success-color: #16803c;
            --danger-color: #c62828;
            --border-color: #d8dee8;
            --border-subtle: #e9edf3;
            --hover-bg: #eef4ff;
            --text-primary: #1f2937;
            --text-secondary: #667085;
            --bg-primary: #ffffff;
            --bg-secondary: #f3f6fa;
            --toolbar-bg: rgba(243, 246, 250, 0.92);
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
            --shadow-hover: 0 10px 28px rgba(15, 23, 42, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 18px 24px 28px;
        }

        .header {
            padding: 2px 2px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 650;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.2;
        }

        .header h1 img {
            width: 28px;
            height: 28px;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            text-align: right;
            max-width: 420px;
        }

        .controls {
            background: var(--toolbar-bg);
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            padding: 10px 2px;
            margin: 0 -2px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 460px;
            margin-right: 16px;
        }

        .search-box input {
            width: 100%;
            height: 38px;
            padding: 8px 38px 8px 13px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(64, 120, 242, 0.1);
        }

        .search-box .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            min-height: 38px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #3060d0;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--hover-bg);
        }

        .btn[aria-busy="true"] .btn-icon {
            animation: spin 0.8s linear infinite;
        }

        .themes-container {
            padding: 0;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            padding-bottom: 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .filter-tab {
            padding: 9px 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            transition: color 0.2s, background 0.2s;
            border-radius: 6px 6px 0 0;
        }

        .filter-tab:hover {
            color: var(--text-primary);
            background: rgba(37, 99, 235, 0.06);
        }

        .filter-tab.active {
            color: var(--primary-color);
        }

        .filter-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10px;
            right: 10px;
            height: 2px;
            background: var(--primary-color);
        }

        .themes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
            gap: 18px;
        }

        .theme-card {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            cursor: pointer;
            background: var(--bg-primary);
            box-shadow: var(--shadow);
        }

        .theme-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: #b7c7e8;
        }

        .theme-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .theme-card.current {
            border-color: var(--success-color);
        }

        .theme-card.current.selected {
            box-shadow: 0 0 0 3px rgba(22, 128, 60, 0.14);
        }

        .theme-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 160px;
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-subtle);
        }

        .theme-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .theme-preview.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .theme-info {
            padding: 13px 14px 14px;
        }

        .theme-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .theme-badge {
            display: inline-block;
            padding: 2px 7px;
            background: var(--primary-color);
            color: white;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
        }

        .theme-badge-in-use {
            background: var(--success-color);
        }

        .theme-badge-saving {
            background: var(--primary-color);
        }

        .theme-badge-source {
            background: #64748b;
        }

        .theme-source {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fff5f5;
            border: 1px solid #f4b4b4;
            color: var(--danger-color);
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.5;
        }

        .status-area:empty {
            display: none;
        }

        .success-message {
            background: #ecfdf3;
            border: 1px solid #b7e3c4;
            color: var(--success-color);
            padding: 12px 14px;
            border-radius: 6px;
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
            animation: toastIn 0.25s ease-out;
        }

        @keyframes toastIn {
            from {
                transform: translateY(12px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            padding: 72px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .header .subtitle {
                text-align: left;
            }

            .themes-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                margin-left: -12px;
                margin-right: -12px;
                padding-left: 12px;
                padding-right: 12px;
            }

            .search-box {
                max-width: none;
                margin-right: 0;
                margin-bottom: 15px;
            }

            .button-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <img src="../swagger-ui/favicon-32x32.png" alt="Swagger UI" width="24" height="24">
                <span data-i18n="optionsTitle">Swagger UI Theme Settings</span>
            </h1>
            <p class="subtitle" data-i18n="optionsSubtitle">Choose your preferred theme for Swagger UI</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search themes..." data-i18n-placeholder="searchThemesPlaceholder">
                <span class="search-icon">🔍</span>
            </div>
            <div class="button-group">
                <button id="refreshBtn" class="btn btn-secondary">
                    <span class="btn-icon">🔄</span> <span class="btn-label" data-i18n="refreshButton">Refresh</span>
                </button>
            </div>
        </div>

        <div class="themes-container">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" data-i18n="allThemes">All Themes</button>
                <button class="filter-tab" data-filter="ilyamixaltik">ilyamixaltik</button>
                <button class="filter-tab" data-filter="ostranme">ostranme</button>
            </div>

            <div id="statusArea" class="status-area"></div>

            <div id="themesGrid" class="themes-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p data-i18n="loadingThemes">Loading themes...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="./options.js"></script>
</body>
</html>
